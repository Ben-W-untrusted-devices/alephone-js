<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aleph One web port -- engine harness</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; }
    .alephone-upload-widget {
      border: 2px dashed #888;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
    }
    .alephone-upload-widget--dragover {
      border-color: #2a7;
      background: #eafaf0;
    }
    .alephone-upload-widget__status {
      color: #555;
      font-size: 0.9em;
    }
    button { font-size: 1em; padding: 0.5em 1em; margin-top: 1rem; }
    /* No explicit width/height here: the game sets the canvas's actual
       width/height *attributes* (its real resolution) once it knows the
       screen size, via Emscripten's SDL2 backend. Forcing a CSS display
       size here would leave that mismatched with the internal resolution
       -- rendering would still look right (just scaled), but mouse click
       coordinates (computed from where the click landed in *displayed*
       pixels, then mapped to the canvas's internal resolution) would come
       out wrong, which fits "menu renders, but no click does anything".
       See WEB_PORT_PLAN.md, M4h. */
    #canvas { display: block; background: #000; margin-top: 1rem; }
    #log { font-size: 0.8em; color: #333; white-space: pre-wrap; background: #f4f4f4; padding: 0.5em; max-height: 12rem; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Engine harness</h1>
  <p>Manual test harness only -- not part of the built game UI. Upload a
  Marathon scenario folder (e.g. the one used for local testing, see
  ../CLAUDE.md), then start the engine. Requires
  <code>web/build-engine.sh</code> to have been run first (see
  WEB_PORT_PLAN.md, M4).</p>

  <div id="widget-root"></div>
  <button id="start-button" disabled>Start engine</button>
  <canvas id="canvas"></canvas>
  <pre id="log"></pre>

  <script type="module">
    import { UploadWidget } from "./src/upload/UploadWidget";
    import { mountUploadedFiles } from "./src/fs/mountUploadedFiles";

    const logEl = document.getElementById("log");
    function log(...args) {
      logEl.textContent += args.join(" ") + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Self-diagnosing page: Safari's Web Inspector has been unusable for
    // this tab (blank window, in both fullscreen and windowed -- not a
    // fullscreen-specific issue after all), so surface as much as possible
    // directly in the visible log panel instead of relying on dev tools.
    window.addEventListener("error", (event) => {
      log("[window error]", event.message, `at ${event.filename}:${event.lineno}`);
    });
    window.addEventListener("unhandledrejection", (event) => {
      log("[unhandled rejection]", event.reason instanceof Error ? event.reason.message : String(event.reason));
    });

    // Heartbeat: logs once every 3s. If this stops appearing, the page's
    // JS main thread itself has frozen (a genuine hang) -- if it keeps
    // appearing but menu clicks still do nothing, the hang theory is ruled
    // out and it's specifically an input-handling problem instead.
    let heartbeatCount = 0;
    setInterval(() => {
      heartbeatCount++;
      log(`[heartbeat ${heartbeatCount}] page is still responsive, ${new Date().toISOString()}`);
    }, 3000);

    // Probes whether the browser will actually give out a working WebGL
    // context right now. A context whose getParameter() returns null is a lost
    // or refused one, and is worse than no context at all: it looks like a
    // success to everything that asks.
    function webGLLooksUsable() {
      let probe = null;
      try {
        const canvas = document.createElement("canvas");
        probe = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!probe) return false;
        if (probe.isContextLost && probe.isContextLost()) return false;
        return probe.getParameter(probe.MAX_TEXTURE_IMAGE_UNITS) > 0;
      } catch {
        return false;
      } finally {
        // Hand the probe context straight back -- holding it would make the
        // very shortage this is checking for slightly worse.
        try {
          probe?.getExtension("WEBGL_lose_context")?.loseContext();
        } catch {
          // nothing useful to do
        }
      }
    }

    let currentFiles = [];
    const startButton = document.getElementById("start-button");

    const widget = new UploadWidget({
      onFilesReady: (files) => {
        currentFiles = files;
        startButton.disabled = files.length === 0;
      },
    });
    document.getElementById("widget-root").appendChild(widget.element);

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Loading engine...";
      try {
        const { default: createAlephOneModule } = await import("/engine/alephone.js");

        const Module = await createAlephOneModule({
          canvas: document.getElementById("canvas"),
          print: (text) => log(text),
          printErr: (text) => log("[stderr]", text),
          // A failing assertion inside Emscripten's own JS (the GL emulation
          // especially) aborts with nothing but "Assertion failed" -- no file,
          // no line, and the stack only ever reaches console. That is not
          // enough to act on, so capture the stack into the page log too,
          // which is the surface actually being read when this happens.
          onAbort: (what) => {
            log("[abort]", String(what));
            const stack = new Error().stack;
            if (stack) {
              for (const line of stack.split("\n").slice(1, 14)) {
                log("[abort]  ", line.trim());
              }
            }
          },
        });

        // Persist preferences/saved games/quicksaves across reloads via
        // IndexedDB. get_data_path() (Source_Files/CSeries/cspaths_sdl.cpp)
        // resolves all of these under $HOME/.alephone, and $HOME defaults to
        // /home/web_user (see engine's getEnvStrings()) -- mounting IDBFS
        // there with autoPersist covers preferences, saved games,
        // quicksaves, image cache, and recordings in one mount, with no
        // per-save C++ changes needed (autoPersist tracks writes/deletes on
        // its own). This must finish *before* callMain(): main() reads
        // preferences synchronously very early in startup. See
        // WEB_PORT_PLAN.md, M4i.
        const persistentDataDir = "/home/web_user/.alephone";

        // Escape hatch: a bad saved preference can make the engine abort during
        // startup, and preferences live in IndexedDB rather than the cache, so
        // reloading -- or even clearing the browser cache -- does not recover.
        //
        // This has to happen *before* the IDBFS mount below. deleteDatabase()
        // does not force anything shut: it waits for existing connections, and
        // fires 'blocked' if any remain. Mounting first opened one, which is
        // why deleting afterwards silently did nothing (the previous attempt
        // treated 'blocked' as success, so it reported a reset it had not done).
        const wantsReset = new URLSearchParams(location.search).has("resetprefs");
        if (wantsReset) {
          log("[persistence] ?resetprefs given -- discarding saved preferences and saved games.");
          const outcome = await new Promise((resolve) => {
            const req = indexedDB.deleteDatabase(persistentDataDir);
            req.onsuccess = () => resolve("deleted");
            req.onerror = () => resolve("error");
            req.onblocked = () => resolve("blocked");
          });
          log(`[persistence] reset ${outcome}.`);
        }

        try {
          Module.FS.mkdir(persistentDataDir);
          Module.FS.mount(Module.IDBFS, { autoPersist: true }, persistentDataDir);
          Module.IDBFS.onAutoPersistStateChanged = (active) => {
            if (active) log("[persistence] saving to IndexedDB...");
          };
          log("Syncing preferences/saved games from IndexedDB...");
          await new Promise((resolve, reject) => {
            Module.FS.syncfs(true, (err) => (err ? reject(err) : resolve()));
          });
          log("IndexedDB sync complete -- saves will persist across reloads.");

          // If deleting the database was blocked, the old preferences are now
          // sitting in the filesystem regardless. Remove them directly so a
          // reset always means a reset.
          if (wantsReset) {
            for (const name of Module.FS.readdir(persistentDataDir)) {
              if (name === "." || name === "..") continue;
              try {
                Module.FS.unlink(`${persistentDataDir}/${name}`);
              } catch {
                // directories and anything already gone -- ignore
              }
            }
            log("[persistence] cleared the persisted directory.");
          }
        } catch (err) {
          log(
            "[persistence] IndexedDB unavailable, saves won't persist across reloads:",
            err instanceof Error ? err.message : String(err)
          );
        }

        log(`Mounting ${currentFiles.length} file(s) into /data ...`);
        const result = await mountUploadedFiles(Module.FS, currentFiles, "/data");
        log(`Mounted ${result.mountedCount} file(s) (${result.skippedCount} skipped).`);

        // Diagnostic: show exactly what ended up at the top of /data -- the
        // engine looks up Map/Shapes/Images/Sounds by exact name there (see
        // WEB_PORT_PLAN.md, M4a), so this is the fastest way to see whether
        // mountUploadedFiles placed things where it expects.
        const topLevel = Module.FS.readdir("/data").filter((n) => n !== "." && n !== "..");
        log(`/data top level: ${topLevel.join(", ")}`);

        log("Starting main()...");
        // --windowed: the engine defaults to requesting real fullscreen
        // (the browser Fullscreen API), which in at least Safari also
        // hides dev tools access entirely for that tab -- forcing windowed
        // avoids the transition altogether, which is also a useful
        // diagnostic for whether unresponsive menu clicks are related to
        // it (e.g. input listeners bound against a pre-fullscreen element
        // reference).
        // ?nogl forces the software renderer, via the engine's own --nogl
        // option. Two uses: it is a way back in when the OpenGL path cannot
        // start at all on a given browser (otherwise the tab is simply dead,
        // and no amount of clearing storage helps, because the problem is not
        // stored anywhere), and it isolates whether a startup failure is in GL
        // initialisation or before it.
        const engineArgs = ["--windowed"];
        if (new URLSearchParams(location.search).has("nogl")) {
          log("?nogl given -- forcing the software renderer.");
          engineArgs.push("--nogl");
        } else if (!webGLLooksUsable()) {
          // A browser will refuse to hand out any more WebGL contexts once too
          // many are live across the whole browser, not just this page -- and
          // what it hands back instead is a context whose queries all return
          // null. Emscripten's GL emulation asserts on the first of those
          // (MAX_TEXTURE_IMAGE_UNITS) and aborts the engine outright, before
          // the main menu, with no way for the C++ side to catch it.
          //
          // Checking first turns that hard failure into a degraded but playable
          // one. It costs a throwaway context on a path that is about to make
          // a real one anyway.
          log("WebGL is not usable right now -- falling back to the software renderer.");
          log("(Another tab may be holding WebGL contexts; restarting the browser usually clears it.)");
          engineArgs.push("--nogl");
        }
        engineArgs.push("/data");
        Module.callMain(engineArgs);
      } catch (err) {
        log("Failed to start:", err instanceof Error ? err.message : String(err));
        console.error(err);
        // Most ways of failing this late are a saved preference the engine
        // cannot cope with, and those survive a reload. Say so, and make the
        // recovery one click rather than something to be discovered.
        // Offer the software renderer too: a startup failure inside GL
        // initialisation is not a preference problem, and resetting
        // preferences will not touch it.
        const softwareButton = document.createElement("button");
        softwareButton.textContent = "Reload with the software renderer";
        softwareButton.style.cssText = "display:block;margin:1rem 0;padding:0.5rem 1rem";
        softwareButton.addEventListener("click", () => {
          const url = new URL(location.href);
          url.searchParams.set("nogl", "");
          location.href = url.toString();
        });
        document.body.appendChild(softwareButton);

        const recover = document.createElement("button");
        recover.textContent = "Reset preferences and reload";
        recover.style.cssText = "display:block;margin:1rem 0;padding:0.5rem 1rem";
        recover.addEventListener("click", () => {
          const url = new URL(location.href);
          url.searchParams.set("resetprefs", "1");
          location.href = url.toString();
        });
        startButton.insertAdjacentElement("afterend", recover);
      } finally {
        startButton.textContent = "Start engine";
      }
    });
  </script>
</body>
</html>
